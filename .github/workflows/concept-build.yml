name: Private concept native builds

on:
  workflow_dispatch:
  push:
    branches: [feat/m2-visual-street]

permissions:
  contents: read

concurrency:
  group: concept-native-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  GODOT_SILENCE_ROOT_WARNING: "1"

jobs:
  native:
    name: Native ${{ matrix.platform }} export and launch
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            archive: Scene112-macOS-universal.zip
          - os: windows-2022
            platform: windows
            archive: Scene112-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      TARGET_PLATFORM: ${{ matrix.platform }}
      TARGET_ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .godot-tools
          key: godot-4.7.2-${{ runner.os }}-${{ hashFiles('tools/setup_godot.py') }}-templates
      - name: Install SHA256-verified editor and matching templates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          Path("build/logs").mkdir(parents=True, exist_ok=True)
          with Path("build/logs/setup.txt").open("w", encoding="utf-8") as log:
              result = subprocess.run([sys.executable, "tools/setup_godot.py",
                  "--cache-dir", ".godot-tools", "--templates"],
                  stdout=log, stderr=subprocess.STDOUT, timeout=900)
          print(Path("build/logs/setup.txt").read_text(encoding="utf-8"))
          assert result.returncode == 0, "Verified toolchain setup failed"
      - name: Import, export, validate and launch standalone build
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import zipfile
          logs = Path("build/logs")
          def run(name, arguments, marker=None, cwd=None):
              engine_log = (logs / f"{name}.engine.txt").resolve()
              if marker:
                  engine_log.unlink(missing_ok=True)
                  arguments = [arguments[0], "--log-file", engine_log, *arguments[1:]]
              try:
                  result = subprocess.run([str(arg) for arg in arguments],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, encoding="utf-8", errors="replace", timeout=240, cwd=cwd)
              except subprocess.TimeoutExpired as error:
                  (logs / f"{name}.txt").write_bytes(error.output or b"")
                  raise
              output = result.stdout
              if marker and engine_log.is_file():
                  output += "\n" + engine_log.read_text(encoding="utf-8", errors="replace")
              (logs / f"{name}.txt").write_text(output, encoding="utf-8")
              print(output)
              assert result.returncode == 0, f"{name} exited {result.returncode}"
              assert "SCRIPT ERROR:" not in output and "ERROR:" not in output, f"{name} emitted errors"
              if marker:
                  assert marker in output, f"{name} did not complete its assertions"
          godot = os.environ["GODOT_BIN"]
          target = os.environ["TARGET_PLATFORM"]
          archive = Path("build") / os.environ["TARGET_ARCHIVE"]
          run("import", [godot, "--headless", "--path", ".", "--editor", "--import"])
          if target == "macos":
              run("export", [godot, "--headless", "--path", ".", "--export-release", "macOS", archive.resolve()])
              run("validate", [sys.executable, "tools/validate_artifacts.py", target, archive])
              staging = Path("build/native-signing")
              run("unpack-for-signing", ["ditto", "-xk", archive, staging])
              apps = list(staging.glob("*.app"))
              assert len(apps) == 1, "Missing standalone application"
              app = apps[0]
              run("godot-resource-seal", [sys.executable, "tools/inspect_macos_signature.py", app])
              # Seal the final bundle using Apple's native signing implementation.
              # The private build uses no paid identity or notarization service.
              run("sign", ["codesign", "--force", "--sign", "-", "--timestamp=none",
                  "--preserve-metadata=identifier,entitlements,flags", "--verbose=2", app])
              run("native-resource-seal", [sys.executable, "tools/inspect_macos_signature.py", app])
              run("signature-before-pack", ["codesign", "--verify", "--deep", "--strict", "--verbose=4", app])
              signed_archive = archive.with_name(archive.stem + ".signed.zip")
              run("pack-signed", ["ditto", "-c", "-k", "--keepParent", "--sequesterRsrc", app, signed_archive])
              signed_archive.replace(archive)
              run("validate-signed", [sys.executable, "tools/validate_artifacts.py", target, archive])
              # Validate and launch a fresh extraction of the exact uploaded ZIP.
              extracted = Path("build/native-smoke")
              run("unpack-final", ["ditto", "-xk", archive, extracted])
              apps = list(extracted.glob("*.app"))
              assert len(apps) == 1, "Missing signed standalone application"
              app = apps[0]
              run("signature", ["codesign", "--verify", "--deep", "--strict", "--verbose=4", app])
              import plistlib
              info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
              executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
              run("architectures", ["lipo", "-archs", executable])
          else:
              distribution = Path("build/windows")
              distribution.mkdir(parents=True, exist_ok=True)
              executable = distribution / "Scene112.exe"
              run("export", [godot, "--headless", "--path", ".", "--export-release", "Windows", executable.resolve()])
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED) as bundle:
                  for file in sorted(distribution.rglob("*")):
                      if file.is_file():
                          bundle.write(file, file.relative_to(distribution))
              run("validate", [sys.executable, "tools/validate_artifacts.py", target, archive])
          # The packaged runtime, without the editor or a source-project path.
          run("native-smoke", [executable.resolve(), "--headless", "--", "--smoke-test"], "SMOKE_OK", executable.parent.resolve())
          run("native-police-playthrough", [executable.resolve(), "--headless", "--", "--police-playthrough"], "SCENE112_POLICE_OK", executable.parent.resolve())
          run("native-fire-playthrough", [executable.resolve(), "--headless", "--", "--fire-playthrough"], "SCENE112_FIRE_OK", executable.parent.resolve())
          run("native-research-playthrough", [executable.resolve(), "--headless", "--", "--research-playthrough"], "SCENE112_RESEARCH_OK", executable.parent.resolve())
          provenance = {
              "head": os.environ["GITHUB_SHA"],
              "source_head": os.environ.get("SOURCE_HEAD", os.environ["GITHUB_SHA"]),
              "godot": "4.7.2.stable", "platform": target,
              "runner_architecture": platform.machine(),
              "run": os.environ["GITHUB_RUN_ID"],
              "archive": archive.name,
              "sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
              "validation": "private concept: structure/architecture/signature plus native headless smoke, police campaign/academy, house fire and investigation assertions; controlled pose fixtures/input are disclosed; no full realtime or human acceptance claim",
              "signing": "native macOS ad-hoc codesign; strict verification before and after ZIP roundtrip" if target == "macos" else "unsigned private Windows build",
              "graphical_playthrough": "requires separate desktop evidence",
          }
          Path(f"build/{target}-provenance.json").write_text(json.dumps(provenance, indent=2) + "\n")
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Upload validated native distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/${{ matrix.archive }}
            build/${{ matrix.platform }}-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Preserve native logs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.platform }}-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14


  native-graphics:
    name: Graphical standalone ${{ matrix.platform }}/${{ matrix.arch }}
    needs: native
    if: needs.native.result == 'success'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos
            arch: arm64
            archive: Scene112-macOS-universal.zip
          - os: windows-2022
            platform: windows
            arch: x86_64
            archive: Scene112-Windows-x64.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Download exact validated native distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ matrix.platform }}-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: build
      - name: Actual concept Compatibility street only
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCHIVE: ${{ matrix.archive }}
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess
          import sys
          import tempfile
          import zipfile
          sys.path.insert(0, str(Path("tools").resolve()))
          import probe_native_graphics as probe
          output = Path("build/graphics").resolve()
          output.mkdir(parents=True, exist_ok=True)
          archive = Path("build") / os.environ["TARGET_ARCHIVE"]
          source = json.loads(Path("build/" + os.environ["TARGET_PLATFORM"] + "-provenance.json").read_text())
          assert source["source_head"] == os.environ["SOURCE_HEAD"], "Source head mismatch"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == source["sha256"], "ZIP hash mismatch"
          with tempfile.TemporaryDirectory(prefix="scene112-concept-graphics-") as directory:
              staging = Path(directory)
              if os.environ["TARGET_PLATFORM"] == "macos":
                  subprocess.run(["ditto", "-xk", str(archive.resolve()), str(staging)], check=True)
                  apps = list(staging.glob("*.app"))
                  assert len(apps) == 1
                  app = apps[0]
                  subprocess.run(["codesign", "--verify", "--deep", "--strict", str(app)], check=True)
                  info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
                  executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
                  driver = "opengl3"
              else:
                  with zipfile.ZipFile(archive) as bundle:
                      for item in bundle.infolist():
                          assert (staging / item.filename).resolve().is_relative_to(staging.resolve()), "Unsafe archive path"
                      bundle.extractall(staging)
                  executable = staging / "Scene112.exe"
                  driver = "opengl3_angle"
              # Reuse the established strict single-profile implementation: actual window,
              # exact driver/backend, exit0, no errors, fresh PNGs and real street gameplay.
              result = probe.profile(executable.resolve(), output,
                  probe.user_directory(os.environ["TARGET_PLATFORM"]), "gl_compatibility", driver)
              evidence = {"source_head": source["source_head"], "sha256": source["sha256"],
                  "scope": "private concept Compatibility street only; no full DoD/human/physical-GPU claim",
                  "profile": result}
              (output / "concept-graphics-provenance.json").write_text(json.dumps(evidence, indent=2) + "\n")
              assert result["status"] == "passed", "Compatibility street failed; preserve actual evidence"
      - name: Preserve actual native graphics evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphics-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/graphics/
          if-no-files-found: warn
          retention-days: 14


  macos-intel:
    name: Optional same macOS concept ZIP on Intel
    needs: native
    if: needs.native.result == 'success'
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Download the tested Universal2 distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: macos-native-${{ github.event.pull_request.head.sha || github.sha }}
          path: build
      - name: Validate provenance and launch on Intel
        shell: python
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import plistlib
          import subprocess
          assert platform.machine() == "x86_64", "Expected an Intel Mac runner"
          logs = Path("build/logs")
          logs.mkdir(parents=True, exist_ok=True)
          archive = Path("build/Scene112-macOS-universal.zip")
          provenance = json.loads(Path("build/macos-provenance.json").read_text())
          assert provenance["source_head"] == os.environ["SOURCE_HEAD"], "Artifact source head mismatch"
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == provenance["sha256"], "Artifact hash mismatch"
          def run(name, arguments, marker=None, cwd=None):
              engine_log = (logs / f"{name}.engine.txt").resolve()
              if marker:
                  engine_log.unlink(missing_ok=True)
                  arguments = [arguments[0], "--log-file", engine_log, *arguments[1:]]
              try:
                  result = subprocess.run([str(arg) for arg in arguments],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
                      text=True, encoding="utf-8", errors="replace", timeout=180, cwd=cwd)
              except subprocess.TimeoutExpired as error:
                  (logs / f"{name}.txt").write_bytes(error.output or b"")
                  raise
              output = result.stdout
              if marker and engine_log.is_file():
                  output += "\n" + engine_log.read_text(encoding="utf-8", errors="replace")
              (logs / f"{name}.txt").write_text(output, encoding="utf-8")
              print(output)
              assert result.returncode == 0, f"{name} exited {result.returncode}"
              assert "SCRIPT ERROR:" not in output and "ERROR:" not in output
              if marker:
                  assert marker in output, f"{name} did not complete its assertions"
          extracted = Path("build/native-smoke")
          run("unpack", ["ditto", "-xk", archive, extracted])
          apps = list(extracted.glob("*.app"))
          assert len(apps) == 1, "Missing standalone application"
          app = apps[0]
          run("signature", ["codesign", "--verify", "--deep", "--strict", app])
          info = plistlib.loads((app / "Contents/Info.plist").read_bytes())
          executable = app / "Contents/MacOS" / info["CFBundleExecutable"]
          run("intel-smoke", [executable.resolve(), "--headless", "--", "--smoke-test"], "SMOKE_OK", executable.parent.resolve())
          run("intel-police-playthrough", [executable.resolve(), "--headless", "--", "--police-playthrough"], "SCENE112_POLICE_OK", executable.parent.resolve())
          run("intel-fire-playthrough", [executable.resolve(), "--headless", "--", "--fire-playthrough"], "SCENE112_FIRE_OK", executable.parent.resolve())
          run("intel-research-playthrough", [executable.resolve(), "--headless", "--", "--research-playthrough"], "SCENE112_RESEARCH_OK", executable.parent.resolve())
          (logs / "provenance.json").write_text(json.dumps({
              "source_head": provenance["source_head"], "sha256": provenance["sha256"],
              "runner_architecture": platform.machine(),
              "validation": "same concept Universal2 archive: native Intel smoke/police/fire/research assertions; fixtures disclosed; optional job, no full human acceptance claim",
              "graphical_playthrough": "requires separate desktop evidence",
          }, indent=2) + "\n")
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Preserve Intel native logs including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-intel-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/logs/
          if-no-files-found: warn
          retention-days: 14


  gate:
    name: Concept ARM Windows build and Compatibility gate
    if: always()
    needs: [native, native-graphics]
    runs-on: windows-2022
    timeout-minutes: 2
    steps:
      - name: Require concept native and actual Compatibility checks
        shell: python
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          GRAPHICS_RESULT: ${{ needs.native-graphics.result }}
        run: |
          import os
          assert os.environ["NATIVE_RESULT"] == "success", "Native export/headless checks failed"
          assert os.environ["GRAPHICS_RESULT"] == "success", "Actual Compatibility street failed"
          print("Private concept native/Compatibility checks passed; full M5 acceptance is not claimed. Intel is reported independently.")
